downstream_rules:
  - "Keep manufacturer's reported properties and model estimates in distinct fields."
  - "Retain the asterisk when estimated/hypothetical inputs feed a derived value."
  - "Do not treat a manufacturer SDS's product-family chemistry as an exact recipe."
  - "Do not populate both frozen and effective transport slots from this single empirical fallback as though two independent CEA calculations had been made."
  - "Do not export these estimates to operational motor inputs without an explicit, visible estimated-data acknowledgment."
